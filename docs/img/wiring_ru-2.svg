<svg aria-label="Наушники: SPK+ через два резистора 150 Ом на Tip и Ring гнезда 3,5 мм, SPK− на Sleeve. Динамик подключён параллельно, плюс через выключатель. Sleeve не соединяется с GND." class="hp" height="300" role="img" viewBox="0 0 770 300" width="770" xmlns="http://www.w3.org/2000/svg"><style>svg {
  --bg: #f3f4f1; --panel: #ffffff; --ink: #1d2226; --dim: #5d666d; --line: #c9cfd2;
  --v33: #c8382f; --gnd: #1d2226; --sda: #1f6fc2; --scl: #a87a00; --int: #8445c4;
  --btn: #237a48; --led: #d0661a; --ledfill: #f2c39c; --key: #e6e9e7;
  --spkp: #8445c4; --spkn: #0f7f86;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { svg {
  --bg: #15191c; --panel: #1d2327; --ink: #e4e8ea; --dim: #97a1a8; --line: #39434a;
  --v33: #ff6a5e; --gnd: #e4e8ea; --sda: #5aa5f0; --scl: #e0b33a; --int: #b98af0;
  --btn: #4cc184; --led: #ff9a4d; --ledfill: #5b3a22; --key: #2a3237; --spkp: #b98af0; --spkn: #4fc3c9; color-scheme: dark } }
svg { color: var(--ink); --display: "Arial Narrow", Arial, sans-serif; --body: Arial, sans-serif; --mono: Menlo, Consolas, monospace; }
.blk { fill: var(--panel); stroke: currentColor; stroke-width: 1.5; }
.pad { fill: var(--panel); stroke: currentColor; stroke-width: 1.3; }
.bt { font: 600 15px var(--display); fill: currentColor; }
.sub { font: 400 11.5px var(--body); fill: var(--dim); }
.pin { font: 500 12px var(--mono); fill: currentColor; }
.lbl { font: 500 12px var(--body); fill: currentColor; }
.w { stroke-width: 2; stroke-linecap: round; fill: none; }
.v33 { stroke: var(--v33); } .gnd { stroke: var(--gnd); } .sda { stroke: var(--sda); }
.scl { stroke: var(--scl); } .int { stroke: var(--int); } .btn { stroke: var(--btn); } .led { stroke: var(--led); }
.dot.v33 { fill: var(--v33); stroke: none; } .dot.gnd { fill: var(--gnd); stroke: none; }
.sw { fill: var(--panel); stroke: var(--btn); stroke-width: 1.8; }
.ledf { fill: var(--led); stroke: var(--led); stroke-width: 1.5; stroke-linejoin: round; }
.res { fill: var(--panel); stroke: var(--v33); stroke-width: 1.8; }
.scr { fill: var(--key); stroke: var(--line); }
.key { fill: var(--key); stroke: var(--line); stroke-width: 1.2; }
.key.trk { stroke: var(--btn); stroke-width: 1.8; }
.kn { font: 600 18px var(--display); fill: currentColor; }
.kl { font: 500 11.5px var(--body); fill: var(--dim); }
.ledbody { fill: var(--ledfill); stroke: var(--led); stroke-width: 1.8; }
.ledflat { stroke: var(--ink); stroke-width: 2.5; }
.ledrim { fill: var(--ledfill); stroke: var(--led); stroke-width: 1.5; }
.leg { stroke: var(--dim); stroke-width: 3; stroke-linecap: round; }
.pwr, .pwrr { stroke: var(--v33); } .pwrt { fill: var(--v33); }
.sig, .sigr { stroke: var(--sda); } .sigt { fill: var(--sda); }
.sw.pwrs { stroke: var(--v33); }
.dot.pwr { fill: var(--v33); stroke: none; }
.spkp { stroke: var(--spkp); } .spkn { stroke: var(--spkn); }
.spkpt { fill: var(--spkp); } .spknt { fill: var(--spkn); }
.dot.spkp { fill: var(--spkp); stroke: none; } .dot.spkn { fill: var(--spkn); stroke: none; }
.res.spkp { stroke: var(--spkp); }
.sw.spkps { stroke: var(--spkp); }</style>
<rect class="blk" height="220" rx="6" width="160" x="20" y="50"></rect><text class="bt" text-anchor="middle" x="100" y="74">WT32-SC01 Plus</text><text class="sub" text-anchor="middle" x="100" y="90">разъём SPK (NS4168)</text>
<circle class="pad" cx="180" cy="100" r="3"></circle><text class="pin" text-anchor="end" x="171" y="104">SPK+</text>
<circle class="pad" cx="180" cy="240" r="3"></circle><text class="pin" text-anchor="end" x="171" y="244">SPK−</text>
<text class="sub" text-anchor="middle" x="100" y="186">мостовой выход:</text><text class="sub" text-anchor="middle" x="100" y="200">оба вывода под сигналом</text>
<line class="w spkp" x1="180" x2="470" y1="100" y2="100"></line><circle class="dot spkp" cx="300" cy="100" r="3.2"></circle>
<line class="w spkp" x1="300" x2="300" y1="100" y2="122"></line><circle class="sw spkps" cx="300" cy="125" r="3"></circle><circle class="sw spkps" cx="300" cy="155" r="3"></circle><line class="w spkp" x1="302" x2="314" y1="127" y2="155"></line><text class="sub" x="322" y="144">выкл.</text>
<line class="w spkp" x1="300" x2="300" y1="158" y2="168"></line>
<rect class="blk" height="46" rx="6" width="90" x="255" y="168"></rect><text class="lbl" text-anchor="middle" x="300" y="188">Динамик</text><text class="sub" text-anchor="middle" x="300" y="204">4–8 Ом</text>
<line class="w spkn" x1="300" x2="300" y1="214" y2="240"></line><circle class="dot spkn" cx="300" cy="240" r="3.2"></circle>
<line class="w spkp" x1="470" x2="470" y1="100" y2="200"></line><circle class="dot spkp" cx="470" cy="160" r="3.2"></circle>
<line class="w spkp" x1="470" x2="500" y1="160" y2="160"></line><rect class="res spkp" height="10" width="34" x="500" y="155"></rect><text class="sub" text-anchor="middle" x="517" y="150">150 Ом</text><line class="w spkp" x1="534" x2="600" y1="160" y2="160"></line>
<line class="w spkp" x1="470" x2="500" y1="200" y2="200"></line><rect class="res spkp" height="10" width="34" x="500" y="195"></rect><text class="sub" text-anchor="middle" x="517" y="190">150 Ом</text><line class="w spkp" x1="534" x2="600" y1="200" y2="200"></line>
<line class="w spkn" x1="180" x2="600" y1="240" y2="240"></line>
<rect class="blk" height="160" rx="6" width="150" x="600" y="104"></rect><text class="bt" x="612" y="126">Наушники</text><text class="sub" x="612" y="142">TRS 3,5 мм, изолированное</text>
<circle class="pad" cx="600" cy="160" r="3"></circle><text class="pin" x="609" y="164">Tip — L</text>
<circle class="pad" cx="600" cy="200" r="3"></circle><text class="pin" x="609" y="204">Ring — R</text>
<circle class="pad" cx="600" cy="240" r="3"></circle><text class="pin" x="609" y="244">Sleeve</text>
<text class="lbl spkpt" x="230" y="92">SPK+</text><text class="lbl spknt" text-anchor="middle" x="390" y="260">SPK− — не GND, не соединять с землёй</text>
</svg>