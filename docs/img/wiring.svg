<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 1090" width="1270" height="1090" role="img" aria-label="Wiring: LiPo through INA226 and IP5306, power switch to the board 5V; MIDI OUT on IO10; encoder on IO11/IO12; PCM5102A DAC on IO13/IO14/IO21 into a MAX97220 headphone amp; PCF8575 on IO43/IO44 with the encoder button, Play, Shift, A, B and eight track buttons.">
