[platformio]
default_envs = wt32

[env:wt32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
extra_scripts = pre:scripts/version.py
monitor_speed = 115200
build_src_filter = +<*> -<teensy/>
lib_ignore = flasherx
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
lib_ignore = flasherx

; Synth board: Teensy 4.1 + PCM5102A on I2S1. First flash over USB (Teensy Loader), later from
; the ESP (PROJ -> SYS -> Update synth, or the /firmware page).
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -std=gnu++17 -DUSB_SERIAL
build_unflags = -std=gnu++14
build_src_filter = +<teensy/>
extra_scripts = pre:scripts/version.py
test_ignore = *

; Voice pool bench on the Teensy (src/teensy/bench.cpp): ~50 s from boot, results over USB Serial
; and the link Log. It ignores the ESP's sound state; do not SAVE projects from a bench build.
[env:teensy41-bench]
extends = env:teensy41
build_flags = ${env:teensy41.build_flags} -DAUDIO_BENCH_POOL

; Desk mode: the bare Teensy on a computer, no ESP / DAC. Link on USB Serial, sound on USB audio
; (and I2S). Drive it with scripts/link_desk.py.
[env:teensy41-desk]
extends = env:teensy41
build_flags = -std=gnu++17 -DUSB_MIDI_AUDIO_SERIAL -DLINK_DESK

; Link check: wt32-echo on the ESP + teensy41-echo on the Teensy, wired; the ESP logs on USB.
; Other rates: add -DLINK_ECHO_BAUD=4000000 (or 5000000) to both.
[env:wt32-echo]
extends = env:wt32
build_flags =
  ${env:wt32.build_flags}
  -DLINK_ECHO_TEST

[env:teensy41-echo]
extends = env:teensy41
build_flags = ${env:teensy41.build_flags} -DLINK_ECHO_TEST

; Over the air: FILE -> Wi-Fi firmware... must be open on the tracker (same network).
; pio run -e wt32-ota -t upload
[env:wt32-ota]
extends = env:wt32
upload_protocol = espota
upload_port = d-trk.local
