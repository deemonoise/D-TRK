[platformio]
default_envs = wt32

[env:wt32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
extra_scripts = pre:scripts/version.py
monitor_speed = 115200
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra

; Over the air: FILE -> Wi-Fi transfer must be open on the tracker (same network).
; pio run -e wt32-ota -t upload
[env:wt32-ota]
extends = env:wt32
upload_protocol = espota
upload_port = d-trk.local

; Diagnostics: SYNTH oscillator timings at boot into /bench.txt (OTA like wt32-ota).
[env:wt32-wtbench]
extends = env:wt32-ota
build_flags =
  ${env:wt32.build_flags}
  -DWT_BENCH

; Diagnostics: the DRUM bench with drive, reverb and the compressor on (see audio.cpp, AUDIO_BENCH_FX).
[env:wt32-fxbench]
extends = env:wt32
build_flags =
  ${env:wt32.build_flags}
  -DAUDIO_BENCH_FX
